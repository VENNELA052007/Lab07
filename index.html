<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Information Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <h1>Weather Information Dashboard</h1>
    <p class="intro">Enter a city to see its current weather.</p>

    <form id="weatherForm" novalidate>
      <label for="cityInput">City name</label>
      <div class="search-row">
        <input
          type="text"
          id="cityInput"
          name="city"
          placeholder="e.g. London"
          autocomplete="off"
        >
        <button id="searchButton" type="submit">Search</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <section id="weatherCard" class="weather-card" aria-live="polite" hidden>
      <h2 id="cityName"></h2>
      <div class="condition-row">
        <img id="weatherIcon" alt="">
        <p id="condition"></p>
      </div>
      <dl class="weather-details">
        <div>
          <dt>Temperature</dt>
          <dd id="temperature"></dd>
        </div>
        <div>
          <dt>Humidity</dt>
          <dd id="humidity"></dd>
        </div>
        <div>
          <dt>Wind speed</dt>
          <dd id="windSpeed"></dd>
        </div>
      </dl>
    </section>

    <p class="key-note">
      Setup: add your OpenWeatherMap API key in <code>script.js</code> by replacing
      <code>YOUR_API_KEY</code>.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
